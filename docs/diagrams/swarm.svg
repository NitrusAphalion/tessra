<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="An intent is partitioned by plan into three groups of units that share dependency edges. Each group is claimed by one agent with a scoped capability and an op budget. The agents propose in parallel; the frontier lands every change that meets the standard onto trunk one landing at a time, and a union that fails verification becomes a conflict task without anyone waiting.">
  <style>
    .bg{fill:#ffffff}
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.25}
    .blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.25}
    .green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.25}
    .grp{fill:none;stroke:#8c959f;stroke-width:1.25;stroke-dasharray:5 4}
    .nd{fill:#f6f8fa;stroke:#59636e;stroke-width:1.25}
    .eg{stroke:#59636e;stroke-width:1.25}
    .dot{fill:#1a7f37}
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .b{font-weight:600}
    .m{fill:#59636e;font-size:12px}
    .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;fill:#1f2328}
    .ok{fill:#1a7f37}
    .ln{stroke:#59636e;stroke-width:1.5;fill:none}
    .ln-ok{stroke:#1a7f37}
    .ah{fill:#59636e}
    .ah-ok{fill:#1a7f37}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .box{fill:#161b22;stroke:#30363d}
      .blue{fill:#0f1e33;stroke:#1f6feb}
      .green{fill:#0f2419;stroke:#238636}
      .grp{stroke:#6e7681}
      .nd{fill:#161b22;stroke:#8b949e}
      .eg{stroke:#8b949e}
      .dot{fill:#3fb950}
      .t,.c{fill:#e6edf3}
      .m{fill:#8b949e}
      .ok{fill:#3fb950}
      .ln{stroke:#8b949e}
      .ln-ok{stroke:#3fb950}
      .ah{fill:#8b949e}
      .ah-ok{fill:#3fb950}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-ok"/></marker>
  </defs>
  <rect class="bg" width="960" height="400"/>

  <text class="t m" x="400" y="26" text-anchor="middle">units under the intent's paths, grouped along their dependency edges</text>

  <!-- intent -->
  <rect class="blue" x="30" y="150" width="150" height="80" rx="6"/>
  <text class="t b" x="105" y="176" text-anchor="middle">Intent</text>
  <text class="c" x="105" y="196" text-anchor="middle">plan --agents 3</text>
  <text class="t m" x="105" y="214" text-anchor="middle">paths src/**</text>
  <line class="ln" x1="180" y1="190" x2="250" y2="190" marker-end="url(#a)"/>
  <text class="t m" x="215" y="182" text-anchor="middle">partition</text>

  <!-- group 1 -->
  <rect class="grp" x="258" y="38" width="100" height="104" rx="8"/>
  <line class="eg" x1="280" y1="90" x2="330" y2="60"/>
  <line class="eg" x1="280" y1="90" x2="330" y2="120"/>
  <circle class="nd" cx="280" cy="90" r="11"/>
  <circle class="nd" cx="330" cy="60" r="11"/>
  <circle class="nd" cx="330" cy="120" r="11"/>
  <text class="t m" x="308" y="158" text-anchor="middle">group 1</text>

  <!-- group 2 -->
  <rect class="grp" x="386" y="138" width="148" height="106" rx="8"/>
  <line class="eg" x1="410" y1="190" x2="460" y2="160"/>
  <line class="eg" x1="410" y1="190" x2="460" y2="220"/>
  <line class="eg" x1="460" y1="160" x2="510" y2="190"/>
  <line class="eg" x1="460" y1="220" x2="510" y2="190"/>
  <circle class="nd" cx="410" cy="190" r="11"/>
  <circle class="nd" cx="460" cy="160" r="11"/>
  <circle class="nd" cx="460" cy="220" r="11"/>
  <circle class="nd" cx="510" cy="190" r="11"/>
  <text class="t m" x="460" y="260" text-anchor="middle">group 2</text>

  <!-- group 3 -->
  <rect class="grp" x="266" y="278" width="98" height="76" rx="8"/>
  <line class="eg" x1="290" y1="300" x2="340" y2="330"/>
  <circle class="nd" cx="290" cy="300" r="11"/>
  <circle class="nd" cx="340" cy="330" r="11"/>
  <text class="t m" x="315" y="370" text-anchor="middle">group 3</text>

  <!-- agents -->
  <rect class="blue" x="580" y="60" width="170" height="60" rx="6"/>
  <text class="t b" x="665" y="82" text-anchor="middle">Agent 1</text>
  <text class="t m" x="665" y="100" text-anchor="middle">scoped capability · op budget</text>
  <rect class="blue" x="580" y="160" width="170" height="60" rx="6"/>
  <text class="t b" x="665" y="182" text-anchor="middle">Agent 2</text>
  <text class="t m" x="665" y="200" text-anchor="middle">scoped capability · op budget</text>
  <rect class="blue" x="580" y="260" width="170" height="60" rx="6"/>
  <text class="t b" x="665" y="282" text-anchor="middle">Agent 3</text>
  <text class="t m" x="665" y="300" text-anchor="middle">scoped capability · op budget</text>

  <line class="ln" x1="358" y1="90" x2="578" y2="90" marker-end="url(#a)"/>
  <text class="t m" x="468" y="82" text-anchor="middle">claims</text>
  <line class="ln" x1="534" y1="190" x2="578" y2="190" marker-end="url(#a)"/>
  <text class="t m" x="556" y="182" text-anchor="middle">claims</text>
  <line class="ln" x1="364" y1="316" x2="578" y2="290" marker-end="url(#a)"/>
  <text class="t m" x="470" y="296" text-anchor="middle">claims</text>

  <!-- frontier -->
  <rect class="green" x="820" y="130" width="120" height="110" rx="6"/>
  <text class="t b" x="880" y="154" text-anchor="middle">Frontier</text>
  <text class="c" x="880" y="172" text-anchor="middle" font-size="11px">promote --to</text>
  <text class="c" x="880" y="186" text-anchor="middle" font-size="11px">landed --all</text>
  <text class="t m" x="880" y="206" text-anchor="middle">lands what meets</text>
  <text class="t m" x="880" y="220" text-anchor="middle">the standard</text>

  <line class="ln" x1="750" y1="90" x2="818" y2="160" marker-end="url(#a)"/>
  <line class="ln" x1="750" y1="190" x2="818" y2="185" marker-end="url(#a)"/>
  <line class="ln" x1="750" y1="290" x2="818" y2="210" marker-end="url(#a)"/>
  <text class="t m" x="784" y="178" text-anchor="middle">propose</text>

  <!-- trunk -->
  <line class="ln ln-ok" x1="880" y1="240" x2="880" y2="352" marker-end="url(#a-ok)"/>
  <text class="t ok" x="888" y="300">lands</text>
  <text class="t m" x="690" y="336" text-anchor="middle">union fails → conflict task, nobody waits</text>
  <text class="t b" x="600" y="350">trunk</text>
  <line class="ln" x1="600" y1="360" x2="940" y2="360" marker-end="url(#a)"/>
  <circle class="dot" cx="660" cy="360" r="5"/>
  <circle class="dot" cx="720" cy="360" r="5"/>
  <circle class="dot" cx="780" cy="360" r="5"/>
  <circle class="dot" cx="840" cy="360" r="5"/>
  <circle class="dot" cx="900" cy="360" r="5"/>
  <text class="t m" x="770" y="384" text-anchor="middle">one landing at a time; everything else runs in parallel</text>
</svg>
