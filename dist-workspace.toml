[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# To add Homebrew: create the NitrusAphalion/homebrew-tap repository, add a
# HOMEBREW_TAP_TOKEN repository secret with write access to it, then add
# "homebrew" here and set `tap = "NitrusAphalion/homebrew-tap"`.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in (first that applies)
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# GitHub provides a native Windows arm64 runner; use it instead of cross-compiling.
[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "windows-11-arm"
