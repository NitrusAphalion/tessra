[workspace]
resolver = "2"
members = [
    "crates/tessra-core",
    "crates/tessra-oplog",
    "crates/tessra-store",
    "crates/tessra-daemon",
    "crates/tessra-cli",
    "crates/tessra-semantic",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NitrusAphalion/tessra"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
blake3 = { version = "1", features = ["pure"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
